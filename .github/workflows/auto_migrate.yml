name: Auto Mapping Converter (26.1)

on:
  workflow_dispatch: # 允許網頁手動點擊觸發

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 25 (Required for 26.1)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Setup Gradle (Force Stable 8.10.2)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2' # 避開 9.x 第三方插件路徑解析崩潰的 Bug

      - name: Grant Execute Permission to Gradle
        run: chmod +x gradlew

      - name: Run Auto Mapping Changer (Translate to Mojang Official Mappings)
        run: ./gradlew migrateMappings --mappings "mojang" --overrideInputsIHaveABackup

      - name: Auto Commit Remapped Code Back to GitHub
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "🤖 Auto-converted mappings to Minecraft 26.1 Official Mappings"
          branch: main
