name: Auto Mapping Converter (26.1)

on:
  workflow_dispatch: # 允許在網頁畫面上手動點擊按鈕觸發

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 25 (Required for 26.1)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Execute Permission to Gradle
        run: chmod +x gradlew

      - name: Run Auto Mapping Changer (Translate to Mojang Official Mappings)
        # 修正這裡：將對照參數修正為 "mojang"，並加入對應的 26.1 映射參數
        run: ./gradlew migrateMappings --mappings "mojang" --overrideInputsIHaveABackup

      - name: Auto Commit Remapped Code Back to GitHub
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "🤖 Auto-converted mappings to Minecraft 26.1 Official Mappings"
          branch: main
