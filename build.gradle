// 修正一：在 plugins 區塊之前，明確告知 Gradle 9.x 該去哪裡尋找 Fabric Loom 本身
buildscript {
    repositories {
        maven { url = "https://maven.fabricmc.net/" }
        mavenCentral()
    }
    dependencies {
        // 使用 classPath 方式引入，這是解決最新版 Gradle 找不到第三方插件最穩固的做法
        classpath "net.fabricmc:fabric-loom:1.9-SNAPSHOT"
    }
}

// 修正二：改用 apply plugin 語法，避開 Gradle 9.x 嚴格的 plugins {} 倉庫限制
apply plugin: 'net.fabricmc.fabric-loom'
apply plugin: 'maven-publish'

version = project.mod_version
group = project.maven_group

base {
    archivesName = "hacked-client"
}

repositories {
    maven { url = "https://maven.fabricmc.net/" }
    maven { url = "https://minecraft.net" } 
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    
    // 26.1 的官方去混淆映射基礎
    mappings loom.officialMojangMappings()
    
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    
    // 如果你有使用 Fabric API，可取消註解
    // implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
    inputs.property "version", project.version
    filteringCharset "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

jar {
    from("LICENSE") {}
}
