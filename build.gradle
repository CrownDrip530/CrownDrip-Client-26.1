// 終極暴力法：直接用 buildscript 強行加載正確網址，完全繞過 Gradle 9.x 的惡意魔改
buildscript {
    repositories {
        maven { url = "https://fabricmc.net" }
        mavenCentral()
    }
    dependencies {
        classpath "net.fabricmc:fabric-loom:1.9-SNAPSHOT"
    }
}

// 避開 plugins 區塊，改用最底層的套用命令
apply plugin: 'net.fabricmc.fabric-loom'
apply plugin: 'maven-publish'

version = project.mod_version
group = project.maven_group

base {
    archivesName = "hacked-client"
}

repositories {
    maven { url = "https://fabricmc.net" }
    maven { url = "https://minecraft.net" } 
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    
    // Minecraft 26.1 去混淆映射基礎
    mappings loom.officialMojangMappings()
    
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
}

processResources {
    inputs.property "version", project.version
    filteringCharset "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

jar {
    from("LICENSE") {}
}
