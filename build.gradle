plugins {
    // 修正一：升級 Loom 版本至 1.7+，才能支援 Java 25 與 26.1 的非混淆架構
    id 'net.fabricmc.fabric-loom' version '1.7-SNAPSHOT'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = "hacked-client"
}

repositories {
    maven { url = "https://maven.fabricmc.net/" }
    maven { url = "https://minecraft.net" } // 確保 Mojang 官方庫下載順暢
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    
    // 修正二：26.1 雖然不混淆，但必須宣告 Mojang 官方映射，Loom 才能為你的 IDE 產生去混淆的源碼！
    mappings loom.officialMojangMappings()
    
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    
    // 如果你未來要用 Fabric API，26.1 必備
    // implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
    inputs.property "version", project.version
    filteringCharset "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

jar {
    from("LICENSE") {
        // 保持乾淨的封裝
    }
}
